# 追加到 /etc/nginx/sites-available/houmq.cn（与 bf-kitchen miniapp 块同级）
# 安装：sudo cp deploy/nginx/footprint.houmq.cn.server.conf 片段追加到 houmq.cn

server {
    server_name footprint.houmq.cn;

    client_max_body_size 20m;

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # 使用独立证书（勿复用 houmq.cn 多域证书，SAN 不含 footprint 会导致小程序请求失败）
    ssl_certificate /etc/letsencrypt/live/footprint.houmq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footprint.houmq.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = footprint.houmq.cn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name footprint.houmq.cn;
    return 404;
}
