# 安装到 ECS：/etc/nginx/conf.d/footprint-api-upload.conf
# 并在 /etc/nginx/sites-available/houmq.cn 增加 footprint.houmq.cn server 块

server {
    server_name footprint.houmq.cn;

    include /etc/nginx/conf.d/footprint-api-upload.conf;

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/houmq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/houmq.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = footprint.houmq.cn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name footprint.houmq.cn;
    return 404;
}
